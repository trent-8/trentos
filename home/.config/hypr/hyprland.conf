monitor = eDP-1, 1920x1200@60, 0x0, 1.25
monitor = desc:Crestron Electronics Inc. Crestron, preferred, auto, auto, mirror, eDP-1
monitor = desc:LG Electronics LG HDR QHD 303NTHM4B113, highres@highrr, auto-center-up, auto
monitor = desc:LG Electronics LG ULTRAGEAR 111NTUW3H478, highres@highrr, auto-center-up, auto
monitor = , preferred, auto-center-up, auto

env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_BACKEND,wayland,x11
env = GRIM_DEFAULT_DIR,$HOME/Pictures
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,32
env = XCURSOR_THEME,macos-tahoe-cursor
env = TERMINAL,alacritty
env = EDITOR,nvim

exec-once = dunst &
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
### for my 2in1 laptop
# exec-once = ~/scripts/powermanager
exec-once = ~/scripts/orientation-manager
exec-once = waybar
# exec-once = hyprpaper
# exec-once = nm-applet
### automatic wallpaper switching
# exec-once = ~/scripts/hlrandbg /usr/share/wallpapers -r
exec-once = sleep 1 && megasync

xwayland {
  force_zero_scaling = true
}

general {
  gaps_in = 2
  gaps_out = 3
  col.active_border = 0xff0eccaa
  resize_on_border = true
}

animations {
  enabled = false
}

decoration {
  rounding = 6
}

dwindle {
  pseudotile = true
  preserve_split = true
}

misc {
  force_default_wallpaper = 0
  disable_hyprland_logo = true
    background_color = 0x202020
}

input {
  touchdevice {
    output = eDP-1
  }
  tablet {
    output = eDP-1
  }
  touchpad {
    natural_scroll = true
    scroll_factor = 0.07
  }
  accel_profile = custom 1.0 0.0 0.75
  natural_scroll = true
  scroll_factor = 0.5
}

gestures {
  workspace_swipe_touch = true
}

gesture = 3, horizontal, workspace

$mainMod = SUPER


bind = SUPER, Space, exec, pidof wofi & pkill wofi || wofi -t=st -S drun -I -n -W 300 -H 700
bind = $mainMod, X, exec, st
bind = $mainMod, E, exec, thunar
bind = $mainMod, C, exec, ~/wpilib/2026/vscode/VSCode-linux-x64/code
bind = $mainMod, B, exec, firefox
bind = $mainMod, N, exec, xournalpp
bind = $mainMod, Z, exec, st -e bluetuith --adapter-states="scan:yes"
# bind = SUPER, W, exec, qemu-system-x86_64 -cdrom win10.iso -m 6G -cpu host -smp 4 -drive file=win10.qcow2,format=qcow2 -accel kvm -device virtio-vga-gl -display sdl,gl=on -usb -device usb-host,hostbus=1,hostport=1
bind = $mainMod, T, exec, st -e btop
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp -d)" - | tee ~/MEGA/Pictures/$(date +"%Y%m%d_%Hh%Mm%Ss")_grim.png | wl-copy
bind = $mainMod, Q, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
# session control commands
bind = $mainMod ALT, L, exit
bindl = $mainMod ALT, R, exec, systemctl reboot
bindl = $mainMod ALT, S, exec, systemctl sleep
bindl = $mainMod ALT, P, exec, systemctl poweroff
# session control commands
bind = $mainMod, D, exec, hyprctl keyword monitor eDP-1, disable
bindl = $mainMod ALT, D, exec, hyprctl keyword monitor eDP-1, disable

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod ALT, left, workspace, -1
bind = $mainMod ALT, right, workspace, +1
bind = $mainMod SHIFT, left, movetoworkspacesilent, -1
bind = $mainMod SHIFT, right, movetoworkspacesilent, +1
bind = $mainMod ALT SHIFT, left, movetoworkspace, -1
bind = $mainMod ALT SHIFT, right, movetoworkspace, +1

bind = $mainMod ALT, 1, workspace, 1
bind = $mainMod ALT, 2, workspace, 2
bind = $mainMod ALT, 3, workspace, 3
bind = $mainMod ALT, 4, workspace, 4
bind = $mainMod ALT, 5, workspace, 5
bind = $mainMod ALT, 6, workspace, 6
bind = $mainMod ALT, 7, workspace, 7
bind = $mainMod ALT, 8, workspace, 8
bind = $mainMod ALT, 9, workspace, 9
bind = $mainMod ALT, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10
bind = $mainMod ALT SHIFT, 1, movetoworkspace, 1
bind = $mainMod ALT SHIFT, 2, movetoworkspace, 2
bind = $mainMod ALT SHIFT, 3, movetoworkspace, 3
bind = $mainMod ALT SHIFT, 4, movetoworkspace, 4
bind = $mainMod ALT SHIFT, 5, movetoworkspace, 5
bind = $mainMod ALT SHIFT, 6, movetoworkspace, 6
bind = $mainMod ALT SHIFT, 7, movetoworkspace, 7
bind = $mainMod ALT SHIFT, 8, movetoworkspace, 8
bind = $mainMod ALT SHIFT, 9, movetoworkspace, 9
bind = $mainMod ALT SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, m+1
bind = $mainMod, mouse_up, workspace, m-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, pamixer --unmute --increase 5
bindel = ,XF86AudioLowerVolume, exec, pamixer --unmute --decrease 5
bindel = ,XF86AudioMute, exec, pamixer --toggle-mute
bindel = ,XF86AudioMicMute, exec, pamixer --default-source --toggle-mute
bindel = ,code:248, exec, pamixer --default-source --toggle-mute
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause ; echo '{ "command": ["cycle", "pause"]}' | socat - /tmp/mpvsocket
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86Favorites, exec, playerctl play-pause ; echo '{ "command": ["cycle", "pause"]}' | socat - /tmp/mpvsocket
bindl = , XF86Calculator, exec, mate-calc

layerrule {
  name = no_anim_for_hyprpicker
  no_anim = true
  match:namespace = hyprpicker
}

layerrule {
  name = no_anim_for_selection
  no_anim = true
  match:namespace = selection
}

windowrule = match:title ^(QEMU)$

windowrule {
  name = suppress-maximize-events
  match:class = .*
  suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$@, 0x0, 1
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}
 
