monitor = eDP-1, 1920x1200x60, 0x0, 1
monitor = DP-1, 2560x1440@75, auto-center-up, 1
monitor = , preferred, auto-center-up, auto

env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_BACKEND,wayland,x11
env = GRIM_DEFAULT_DIR,$HOME/Pictures
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Breeze_Light
env = TERMINAL,alacritty
env = EDITOR,nvim

exec-once = dunst &
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar &
exec-once = hyprpaper &
### for my 2in1 laptop
exec-once = ~/scripts/orientation-manager &
exec-once = ~/scripts/hlrandbg /usr/share/wallpapers -r &
exec-once = ~/scripts/powermanager &
exec-once = solaar -w hide &
exec-once = nm-applet &

general {
  gaps_in = 2
  gaps_out = 3
  col.active_border = 0xff0eccaa
  resize_on_border = true
}

animations {
  enabled = false
}

decoration {
  rounding = 5
}

dwindle {
  pseudotile = true
  preserve_split = true
}

misc {
  force_default_wallpaper = 0
  disable_hyprland_logo = true
}

input {
  touchdevice {
    output = eDP-1
  }
  tablet {
    output = eDP-1
  }
  accel_profile = custom 1.0 0.0 0.5
}

gestures {
  workspace_swipe_touch = true
}
$mainMod = SUPER



bind = SUPER, Space, exec, pidof wofi & pkill wofi || wofi -t=alacritty -S drun -I -n -W 300 -H 700
bind = SUPER, X, exec, alacritty
bind = SUPER, E, exec, thunar
bind = SUPER, C, exec, code
bind = SUPER, B, exec, firefox
bind = SUPER, R, exec, rnote
bind = SUPER, Z, exec, alacritty -e bash -c 'bluetuith --adapter-states="scan:yes"'
# bind = SUPER, W, exec, qemu-system-x86_64 -cdrom win10.iso -m 6G -cpu host -smp 4 -drive file=win10.qcow2,format=qcow2 -accel kvm -device virtio-vga-gl -display sdl,gl=on -usb -device usb-host,hostbus=1,hostport=1
bind = $mainMod, T, exec, alacritty -e btop
bind = SUPER SHIFT, XF86Assistant, exec, xdg-open https://chatgpt.com
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp -d)" - | tee ~/Pictures/$(date +"%Y%m%d_%Hh%Mm%Ss")_grim.png | wl-copy
bind = $mainMod SHIFT, Q, exit
bindl = $mainMod SHIFT, R, exec, systemctl reboot
bindl = $mainMod CTRL SHIFT, S, exec, systemctl suspend
bindl = $mainMod CTRL SHIFT, Q, exec, systemctl poweroff
bind = $mainMod, Q, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod CTRL, left, workspace, -1
bind = $mainMod CTRL, right, workspace, +1
bind = $mainMod SHIFT, left, movetoworkspacesilent, -1
bind = $mainMod SHIFT, right, movetoworkspacesilent, +1
bind = $mainMod CTRL SHIFT, left, movetoworkspace, -1
bind = $mainMod CTRL SHIFT, right, movetoworkspace, +1

bind = $mainMod CTRL, 1, workspace, 1
bind = $mainMod CTRL, 2, workspace, 2
bind = $mainMod CTRL, 3, workspace, 3
bind = $mainMod CTRL, 4, workspace, 4
bind = $mainMod CTRL, 5, workspace, 5
bind = $mainMod CTRL, 6, workspace, 6
bind = $mainMod CTRL, 7, workspace, 7
bind = $mainMod CTRL, 8, workspace, 8
bind = $mainMod CTRL, 9, workspace, 9
bind = $mainMod CTRL, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10
bind = $mainMod CTRL SHIFT, 1, movetoworkspace, 1
bind = $mainMod CTRL SHIFT, 2, movetoworkspace, 2
bind = $mainMod CTRL SHIFT, 3, movetoworkspace, 3
bind = $mainMod CTRL SHIFT, 4, movetoworkspace, 4
bind = $mainMod CTRL SHIFT, 5, movetoworkspace, 5
bind = $mainMod CTRL SHIFT, 6, movetoworkspace, 6
bind = $mainMod CTRL SHIFT, 7, movetoworkspace, 7
bind = $mainMod CTRL SHIFT, 8, movetoworkspace, 8
bind = $mainMod CTRL SHIFT, 9, movetoworkspace, 9
bind = $mainMod CTRL SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, m+1
bind = $mainMod, mouse_up, workspace, m-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, pamixer --unmute --increase 5
bindel = ,XF86AudioLowerVolume, exec, pamixer --unmute --decrease 5
bindel = ,XF86AudioMute, exec, pamixer --toggle-mute
bindel = ,XF86AudioMicMute, exec, pamixer --default-source --toggle-mute
bindel = ,code:248, exec, pamixer --default-source --toggle-mute
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause ; echo '{ "command": ["cycle", "pause"]}' | socat - /tmp/mpvsocket
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86Favorites, exec, playerctl play-pause ; echo '{ "command": ["cycle", "pause"]}' | socat - /tmp/mpvsocket
bindl = , XF86Calculator, exec, mate-calc

layerrule = noanim, hyprpicker
layerrule = noanim, selection

windowrulev2 = tile, title:^(QEMU)$

windowrulev2 = suppressevent maximize, class:.*

windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
