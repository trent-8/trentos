<match target="pattern">
  <test qual="any" name="family" compare="eq"><string>monospace</string></test>
  <edit name="family" mode="assign" binding="same"><string>Source Code Pro</string></edit>
</match>
<match target="pattern">
  <test qual="any" name="family" compare="eq"><string>serif</string></test>
  <edit name="family" mode="assign" binding="same"><string>FreeSerif</string></edit>
</match>
<match target="pattern">
  <test qual="any" name="family" compare="eq"><string>serif</sans-serif></test>
  <edit name="family" mode="assign" binding="same"><string>FreeSans</string></edit>
</match>